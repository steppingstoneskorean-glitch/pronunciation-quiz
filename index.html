<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한국어 듣기 퀴즈 (K-Listen Master)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            /* 수채화 느낌의 따뜻하고 귀여운 파스텔톤 배경 */
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --app-bg: rgba(255, 255, 255, 0.4);
            --app-border: rgba(255, 255, 255, 0.6);
            --text-main: #4a4a4a;
            --text-muted: #8e8e8e;
            --primary: #fb923c; /* 따뜻한 오렌지/브라운 톤 */
            --success: #4ade80;
            --danger: #f87171;
            --glass-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: var(--text-main); padding: 20px; }

        /* 모바일 앱 컨테이너 */
        .phone-container {
            width: 100%; max-width: 420px; height: 850px; background: var(--app-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--app-border); border-radius: 36px; box-shadow: var(--glass-shadow); display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 30px 24px; display: flex; flex-direction: column;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease, transform 0.4s ease; transform: scale(0.98);
        }
        .screen.active { opacity: 1; pointer-events: auto; transform: scale(1); z-index: 10; }
